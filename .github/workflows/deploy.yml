name: Deploy CRM Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env file
        run: |
          echo "REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}" > .env
          echo "REACT_APP_NAME=${{ secrets.REACT_APP_NAME }}" >> .env
          echo "REACT_APP_VERSION=${{ secrets.REACT_APP_VERSION }}" >> .env
          echo "REACT_APP_TOKEN_KEY=${{ secrets.REACT_APP_TOKEN_KEY }}" >> .env
          echo "REACT_APP_REFRESH_KEY=${{ secrets.REACT_APP_REFRESH_KEY }}" >> .env
          echo "REACT_APP_USER_KEY=${{ secrets.REACT_APP_USER_KEY }}" >> .env

          cat .env

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: aws s3 sync build/ s3://crm.sujathadevelopers.in --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_ID }} \
          --paths "/*"